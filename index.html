
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101820">
  <title>Ciudad Abierta 3D | Multijugador</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="menu" class="panel">
    <div class="logo">CA<span>3D</span></div>
    <h1>CIUDAD ABIERTA 3D</h1>
    <p class="subtitle">Explora la ciudad con tus amigos</p>

    <form id="joinForm">
      <label for="playerName">Nombre del jugador</label>
      <input
        id="playerName"
        type="text"
        maxlength="18"
        placeholder="Tu nombre"
        autocomplete="nickname"
        required
      >

      <label for="roomCode">Código de la sala</label>
      <input
        id="roomCode"
        type="text"
        maxlength="20"
        placeholder="Ejemplo: AMIGOS123"
        autocomplete="off"
      >

      <button id="joinButton" type="submit">
        Entrar a la ciudad
      </button>

      <button id="newRoomButton" type="button" class="secondary">
        Crear una sala nueva
      </button>
    </form>

    <p id="menuStatus" class="status" role="status">
      Escribe tu nombre para comenzar.
    </p>

    <p class="small">
      Multijugador para hasta 10 participantes por sala.
    </p>
  </main>

  <main id="game" hidden>
    <div id="hud">
      <div class="hud-brand">
        <strong>CIUDAD ABIERTA <span>3D</span></strong>
        <small>Sala: <b id="currentRoom">---</b></small>
        <small>Jugadores: <b id="playerCount">1</b>/10</small>
      </div>

      <button id="copyRoomButton" class="small-button">
        Invitar amigos
      </button>

      <button id="leaveButton" class="danger small-button">
        Salir
      </button>
    </div>

    <div id="help">
      <strong>CONTROLES</strong>
      <p>W A S D — Moverse</p>
      <p>Shift — Correr</p>
      <p>Ratón — Girar cámara</p>
      <p>Esc — Liberar ratón</p>
    </div>

    <div id="notice" role="status"></div>
  </main>

  <script type="module" src="./game.js"></script>
</body>
</html>
