
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciudad Abierta 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu">
    <h1>Ciudad Abierta 3D</h1>

    <label for="playerName">Nombre del jugador</label>
    <input id="playerName" placeholder="Tu nombre" maxlength="20">

    <label for="roomCode">Código de sala</label>
    <input id="roomCode" placeholder="Ej. ciudad123" maxlength="30">

    <button id="joinBtn">Entrar a la ciudad</button>
    <p id="status">Listo para jugar</p>
  </div>

  <div id="hud">
    <div id="health">Vida: 100</div>
    <div id="weapon">Arma: Pistola</div>
    <div id="ammo">Munición: 12</div>
    <div id="controls">
      WASD: moverse | Shift: correr | Espacio: saltar<br>
      Mouse: mirar | 1/2: armas | Clic: disparar<br>
      R: recargar | º: liberar ratón | Esc: liberar ratón
    </div>
    <button id="releaseBtn">Liberar ratón (º)</button>
    <button id="leaveBtn">Salir de la sala</button>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
