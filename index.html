
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciudad Abierta 3D Multijugador</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu" class="panel">
    <h1>CIUDAD ABIERTA 3D</h1>
    <p>Multijugador en línea</p>

    <label for="playerName">Tu nombre</label>
    <input id="playerName" maxlength="18" placeholder="Escribe tu nombre">

    <label for="roomCode">Código de sala</label>
    <input id="roomCode" maxlength="20" placeholder="Ejemplo: AMIGOS123">

    <button id="joinButton">Entrar a la ciudad</button>
    <button id="newRoomButton" class="secondary">Crear sala nueva</button>

    <p id="menuStatus">Introduce un nombre y un código para jugar con amigos.</p>
    <p class="small">
      Se necesita configurar Supabase para activar el multijugador.
    </p>
  </div>

  <div id="game" hidden>
    <div id="hud">
      <div>
        <strong>CIUDAD ABIERTA 3D</strong>
        <div>Sala: <span id="currentRoom">---</span></div>
        <div>Jugadores: <span id="playerCount">1</span>/10</div>
      </div>
      <button id="copyRoomButton">Copiar invitación</button>
      <button id="leaveButton">Salir</button>
    </div>

    <div id="help">
      <b>Controles</b><br>
      W A S D — Moverse<br>
      Flechas — Moverse<br>
      Shift — Correr<br>
      Ratón — Girar cámara
    </div>

    <div id="notice"></div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
